{% load static %}
<html>
    <head>
        <title>
            Registration
        </title>
        <link rel="stylesheet" href="{% static 'css/registration.css' %}">
    </head>
    <body>
        <center>
            <nav>
                <a href="{% url 'home' %}">Home</a>
                <a href="{% url 'about' %}">About</a>
                <a href="{% url 'view' %}">View</a>
                {% if request.session %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'registration' %}">Registration</a>
                {% else %}
                <a href="{% url 'logout' %}">Logout</a>
                {% endif %}
            </nav>
            <h1>
                This Is A Registration Page
            </h1>
            <form method="post" action="{% url 'registration' %}">
                <table>
                    {% csrf_token %}
                    <tr>
                        <th><label for="">First Name</label></th>
                        <td><input type="text" name="firstname" required></td>
                    </tr>
                   <tr>
                     <th><label for="">Last Name</label></th>
                     <td><input type="text" name="lastname" required id=""></td>
                   </tr>
                    <tr>
                        <th><label for="">Email</label></th>
                        <td><input type="email" name="email" required id=""></td>
                    </tr>
                    <tr>
                        <th><label for="">Password</label></th>
                        <td><input type="password" name="password" required id=""></td>
                    </tr>
                    <tr>
                        <th><label for="">Course</label></th>
                        <td><select name="course" id="" required>
                        <option value="">Select</option>
                        <option value="diploma">diploma</option>
                        <option value="btech">Btech</option>
                        <option value="mtech">Mtech</option>
                        <option value="phd">PhD</option>
                        <option value="masters">Masters</option>
                        <option value="ms">MS</option>
                        </select></td>
                    </tr>
                    <tr>
                        <th><label for="">Department</label></th>
                        <td><select name="department" id="" required>
                        <option value="">Select</option>
                        <option value="cse">CSE</option>
                        <option value="aiml">AIML</option>
                        <option value="ece">ECE</option>
                        <option value="eee">EEE</option>
                        <option value="mech">MECH</option>
                        <option value="civil">CIVIL</option>
                        </select></td>
                    </tr>
                    <tr>
                        <th><label for="">Guardian</label></th>
                        <td><input type="text" name="guardian" required></td>
                    </tr>
                    <tr>
                        <th><label for="">Contact</label></th>
                        <td><input type="number" name="contact" required></td>
                    </tr>
                    <tr>
                        <td colspan="2" style="text-align:center;">
                            <input type="submit" value="Submit">
                            <input type="reset" value="Clear">
                        </td>
                    </tr>
                </table>
            </form>
        </center>
    </body>
</html>
