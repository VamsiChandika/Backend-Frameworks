<html>
    <head>
        <link rel="stylesheet" href="{{url_for('static',filename='css/registration.css')}}">
    </head>
    <body>
        <center>
            <nav>
                <a href="{{url_for('home')}}">Home</a> |
                <a href="{{url_for('authentication')}}">Authentication</a> |
                <a href="{{url_for('view')}}">View</a> |
                {% if session.get('user') %}
                <a href="{{url_for('logout')}}">Logout</a>
                {% else %}
                <a href="{{url_for('registration')}}">Registration</a> |
                <a href="{{url_for('login')}}">Login</a>
                {% endif %}
            </nav>
            <h1>
                This Is A Registration Page
            </h1>
            <table>
                <form method="post" action="{{url_for('registration')}}">
                <tr>
                    <th><label for="">First Name  </label></th>
                    <td><input type="text" placeholder="Firstname" name="firstname" required/></td>
                </tr>

                <tr><th><label for="">Last Name  </label></th>
                <td><input type="text" placeholder="Lastname" name="lastname" required/></td></tr>

                <tr>
                    <th><label for="">Password  </label></th>
                    <td><input type="password" name="password" placeholder="********" required/></td>
                </tr>

                <tr>
                    <th><label for="">Gender  </label></th>
                    <td><input type="radio" name="gender" value="male">Male
                    <input type="radio" name="gender" value="female">Female
                    <input type="radio" name="gender" value="others">Others</td>
                </tr>
                

                <tr>
                    <th><label for="">Mobile Number  </label></th>
                    <td><input type="number" placeholder="91+ " name="mobileno" required/></td>
                </tr>


               <tr>
                    <th> <label for="">Course  </label></th>
                    <td><select name="course" id="">
                    <option value="">Select Course</option>
                    <option value="DIPLOMA">DIPLOMA</option>
                    <option value="Btech">Btech</option>
                    <option value="Mtech">Mtech</option>
                    <option value="PhD">PhD</option>
                    <option value="MS">MS</option>
                </select></td>
               </tr>

               <tr>
                    <th><label for="">Department  </label></th>
                    <td><select name="department">
                    <option value="">Select Department</option>
                    <option value="CSE">CSE</option>
                    <option value="AIML">AIML</option>
                    <option value="ECE">ECE</option>
                    <option value="EEE">EEE</option>
                    <option value="MECH">MECH</option>
                    <option value="CIVIL">CIVIL</option>
                </select></td>
                </tr>


               <tr>
                <th><label for="">Guardian Name</label></th>
                <td><input type="text" name="guardian_name" required/></td>
               </tr>
               
               
               <tr>
                 <th><label for="">Address  </label></th>
                <td><textarea name="address" rows="6" cols="30" ></textarea></td>
               </tr>

                <tr>
                    <td colspan="2" align="center"><input type="submit" value="Submit">
                    <input type="reset" value="Clear"></td>
                </tr>


            </form>
            </table>
        </center>
    </body>
</html>
